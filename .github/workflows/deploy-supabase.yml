name: Deploy Fresa Master API to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'src/*.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_ID: jnakhctoigbepxwbaygk
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure the repository Actions secret SUPABASE_ACCESS_TOKEN with a Supabase personal access token. Do not use the anon key, service_role key, or Melhor Envio token."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Run regression tests
        run: node --import tsx --test src/*.test.ts supabase/functions/_shared/*.test.ts
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Deploy API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy api --project-ref "$SUPABASE_PROJECT_ID" --use-api
