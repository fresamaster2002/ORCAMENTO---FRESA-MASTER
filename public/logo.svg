<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Router Bit / Fresa Icon Illustration -->
  <g transform="translate(256, 210)" filter="url(#glow)">
    <!-- Fresa Shank / Haste (Metal Duro) -->
    <rect x="-24" y="-120" width="48" height="95" rx="8" fill="#94a3b8"/>
    <rect x="-20" y="-115" width="10" height="85" fill="#cbd5e1" opacity="0.7"/>
    
    <!-- Chamfer / Collar -->
    <path d="M -32,-25 L 32,-25 L 24,-5 L -24,-5 Z" fill="#64748b"/>

    <!-- Flutes / Cortes da Fresa (TCT / Widia) -->
    <path d="M -30,-5 C -36,25 -20,60 -28,95 L 0,120 L 28,95 C 20,60 36,25 30,-5 Z" fill="url(#goldGrad)"/>
    
    <!-- Cutting Edges Lines -->
    <path d="M -24,5 Q -8,45 -22,85" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 0,0 Q 8,45 0,110" stroke="#78350f" stroke-width="3" fill="none"/>
    <path d="M 24,5 Q 8,45 22,85" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
    
    <!-- Micro Drill Tip -->
    <polygon points="-10,110 0,128 10,110" fill="#f59e0b"/>
  </g>

  <!-- Circular Precision Ring -->
  <circle cx="256" cy="210" r="140" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="210" r="155" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Typography -->
  <text x="256" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="1">
    FRESA MASTER
  </text>
  <text x="256" y="430" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="url(#goldGrad)" letter-spacing="4">
    CNC &amp; USINAGEM
  </text>
  <text x="256" y="460" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">
    INTEGRAÇÃO BLING ERP &amp; NF-E
  </text>
</svg>
