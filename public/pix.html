<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chave Pix • Fresa Master</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1220;font-family:Arial,Helvetica,sans-serif;color:#f8fafc}
.card{width:min(92vw,380px);background:#111a2e;border:2px solid #ff6a00;border-radius:16px;padding:28px 22px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
h1{margin:0 0 4px;font-size:22px;letter-spacing:.06em}
small{color:#ff8a1f;letter-spacing:.2em;font-weight:700}
.lbl{margin:22px 0 8px;color:#cbd5e1;font-size:14px}
.key{font-family:Consolas,monospace;font-size:22px;font-weight:700;background:#fff;color:#0f172a;border-radius:10px;padding:12px 8px;user-select:all}
button{margin-top:18px;width:100%;padding:16px;border:0;border-radius:10px;background:#ff6a00;color:#0b1220;font-size:18px;font-weight:800;cursor:pointer}
button.ok{background:#34d399}
p{color:#94a3b8;font-size:13px;margin:14px 0 0}
</style>
</head>
<body>
<div class="card">
<h1>FRESA MASTER</h1><small>CNC MACHINING</small>
<div class="lbl">Chave Pix (CNPJ)</div>
<div class="key" id="k">59.085.330/0001-70</div>
<button id="b" type="button">Copiar chave Pix</button>
<p>Cole a chave no app do seu banco para pagar.</p>
</div>
<script>
var b=document.getElementById('b'),k='59.085.330/0001-70';
function done(){b.textContent='Chave copiada!';b.className='ok';setTimeout(function(){b.textContent='Copiar chave Pix';b.className='';},2500);}
b.onclick=function(){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(k).then(done,fallback);}else{fallback();}
};
function fallback(){var r=document.createRange();r.selectNodeContents(document.getElementById('k'));var s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');done();}catch(e){}}
</script>
</body>
</html>
